<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informes QA</title><style>
:root{--bg:#f4f6f9;--paper:#fff;--ink:#1d2733;--muted:#5d6b7c;--line:#e2e7ee;--soft:#f7f9fb;
--accent:#2f5bea;--accent-soft:#eaf0ff;--ok:#1a7f4b;--ok-soft:#e7f6ee;--code-bg:#1e2430;--code-ink:#e6e9ef;
--rojo:#c62828;--rojo-s:#fdecec;--naranja:#b35c00;--naranja-s:#fff3e0;--azul:#1f5fbf;--azul-s:#e8f0fd;
--verde:#1a7f4b;--verde-s:#e6f6ed;--morado:#6b3fb3;--morado-s:#f1eafc;--gris:#5d6b7c;--gris-s:#eef1f5;--oscuro:#2b3440;--oscuro-s:#e4e8ee}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--paper:#1a2029;--ink:#e3e8ef;--muted:#9aa7b7;--line:#2c3542;--soft:#202733;
--accent:#7ea1ff;--accent-soft:#1f2a44;--ok:#5fd39a;--ok-soft:#16301f;--code-bg:#0f1319;
--rojo:#ff8a80;--rojo-s:#3a1d1d;--naranja:#ffb74d;--naranja-s:#3a2a14;--azul:#8ab4ff;--azul-s:#1b2a45;
--verde:#6fdca3;--verde-s:#15301f;--morado:#c3a3ff;--morado-s:#2a2140;--gris:#aab4c2;--gris-s:#262e39;--oscuro:#cfd6e0;--oscuro-s:#2a323d}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:20}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--paper);border-right:1px solid var(--line);padding:22px 16px 40px}
aside .brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 8px 4px}
aside .doc-title{font-weight:700;font-size:15px;margin:0 8px 16px;line-height:1.35}
aside a.back{display:block;margin:0 8px 18px;font-size:13px;color:var(--accent);text-decoration:none}
nav ul{list-style:none;margin:0;padding:0}
nav a{display:block;color:var(--muted);text-decoration:none;font-size:13.5px;line-height:1.35;padding:5px 8px;border-radius:6px;border-left:2px solid transparent}
nav a:hover{background:var(--soft);color:var(--ink)}
nav a.active{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
nav .l1>a{color:var(--ink);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-top:14px}
nav .l2>a{padding-left:12px}
nav ul.sub{display:none;margin-left:12px;border-left:1px solid var(--line)}
nav li.open>ul.sub{display:block}
nav ul.sub a{font-size:12.5px;padding:3px 10px}
main{padding:40px 56px 120px;max-width:1040px;width:100%;min-width:0}
article.part,.card{min-width:0;overflow-wrap:break-word}
.doc-head{margin-bottom:28px}
.doc-head .kicker{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.doc-head .title{font-size:34px;font-weight:750;line-height:1.2;margin:6px 0 10px}
.doc-head .meta{color:var(--muted);font-size:14px}
.btn-excel{display:inline-block;margin-top:14px;font-size:14px;font-weight:650;text-decoration:none;color:#fff;background:#1d6f42;border-radius:8px;padding:8px 16px}
.btn-excel:hover{background:#155232}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pills a{font-size:13px;text-decoration:none;color:var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:999px}
article.part{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 44px;margin-bottom:36px}
.part-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:10px}
.part-label{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:28px;line-height:1.25;margin:4px 0 0}
h2{font-size:22px;line-height:1.3;margin:44px 0 12px;padding-top:6px}
h3{font-size:17.5px;line-height:1.35;margin:30px 0 10px}
h4{font-size:15.5px;margin:22px 0 8px;color:var(--muted)}
p{margin:10px 0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
strong{font-weight:650}
code{font-family:Consolas,"Cascadia Code",Menlo,monospace;font-size:.88em;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
code.id{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
blockquote{margin:14px 0;padding:12px 18px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
blockquote p{margin:0}
ul,ol{padding-left:24px;margin:8px 0}
li{margin:4px 0}
li.task{list-style:none;margin-left:-20px}
.chk{color:var(--accent);font-size:1.05em;margin-right:4px}
.table-wrap{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
th{background:var(--soft);text-align:left;font-weight:650;color:var(--ink);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.nowrap{white-space:nowrap}
td.wide{min-width:240px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 55%,transparent)}
table.meta td:first-child{width:26%;font-weight:600;color:var(--muted);background:var(--soft)}
table.meta thead{display:none}
.b{display:inline-block;font-size:12.5px;font-weight:650;padding:1px 9px;border-radius:999px;white-space:nowrap}
.b-rojo{color:var(--rojo);background:var(--rojo-s)}.b-naranja{color:var(--naranja);background:var(--naranja-s)}
.b-azul{color:var(--azul);background:var(--azul-s)}.b-verde{color:var(--verde);background:var(--verde-s)}
.b-morado{color:var(--morado);background:var(--morado-s)}.b-gris{color:var(--gris);background:var(--gris-s)}
.b-oscuro{color:var(--oscuro);background:var(--oscuro-s)}
.card{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:6px 24px 16px;margin:22px 0;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin-top:16px}
.card h4{margin-top:14px;font-size:16.5px;color:var(--ink);line-height:1.4}
.card ul{margin-top:6px}
.tag-id{display:inline-block;font-family:Consolas,Menlo,monospace;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;margin-right:6px;vertical-align:2px}
p.label{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.expected{background:var(--ok-soft);border-left:4px solid var(--ok);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.expected-title{margin:0 0 4px}
div.expected ul{margin:4px 0 0}
div.expected li{margin:5px 0}
/* Tabla de preguntas del refinamiento: la columna Respuesta se ve como un espacio para escribir */
table.preguntas td.wide{min-width:200px}
table.preguntas td.resp{min-width:150px;background:var(--soft);border-left:1px dashed var(--line)}
table.preguntas td.resp:empty::before{content:"Sin respuesta";color:var(--muted);font-style:italic;font-size:13.5px}
div.exec{margin-top:14px;padding:10px 14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px;background:var(--soft)}
.code{position:relative;margin:14px 0 18px}
.code-lang{position:absolute;top:8px;right:12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8b95a7}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);padding:18px 20px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.6}
pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.g-kw{color:#7fb4ff;font-weight:700}.g-tag{color:#e0a458}.g-com{color:#7d8799;font-style:italic}
.g-str{color:#a5d6a7}.g-pipe{color:#6b7689}.g-param{color:#f48fb1}
/* Resultado vs. análisis */
.blk{margin:40px 0 8px}
.blk-label{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.blk-resultado>.blk-label{color:var(--ok);background:var(--ok-soft)}
.blk-resumen>.blk-label{color:var(--accent);background:var(--accent-soft)}
section.blk>h2{margin-top:10px}
.blk-explicacion{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 24px 12px}
.blk-explicacion>.blk-label{color:var(--accent);background:var(--paper)}
.blk-explicacion li{margin:8px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 16px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
details.blk-analisis{border:1.5px dashed var(--line);background:var(--soft);border-radius:12px;padding:0 22px}
details.blk-analisis .blk-label{color:var(--gris);background:var(--gris-s)}
details.blk-analisis>summary h2{margin:8px 0 2px;font-size:19px;color:var(--muted)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details.blk-analisis>summary{padding:16px 0}
.blk-hint{font-size:13px;color:var(--accent);font-weight:600}
.blk-hint::after{content:"Mostrar ▾"}
details[open]>summary>.blk-hint::after{content:"Ocultar ▴"}
.blk-body{padding-bottom:18px}
.blk-end{margin-top:22px;padding-top:10px;border-top:1.5px dashed var(--line);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
details.sub-analisis{margin:14px 0;border:1.5px dashed var(--line);border-radius:10px;background:var(--soft);padding:0 16px}
details.sub-analisis>summary{padding:10px 0;font-size:14.5px;color:var(--muted)}
.sub-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);background:var(--gris-s);padding:2px 8px;border-radius:999px;margin-right:4px}
.sub-body{padding-bottom:10px}
p.porque{font-size:14px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 12px}
/* Términos con explicación */
.term{border-bottom:1.5px dotted var(--accent);cursor:help;outline:none}
.term::after{content:"?";display:inline-block;font-size:10px;font-weight:700;line-height:14px;width:14px;height:14px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;margin-left:3px;vertical-align:super}
.term:focus{background:var(--accent-soft)}
pre .term{border-bottom-color:#e0a458}
pre .term::after{background:#e0a458;color:#1e2430}
#tip{position:fixed;z-index:60;max-width:320px;background:var(--ink);color:var(--paper);font-size:13.5px;line-height:1.45;padding:10px 13px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;pointer-events:none}
#tip b{display:block;margin-bottom:3px}
/* Leyenda y glosario */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:18px;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--muted)}
.legend .blk-label{margin-right:4px}
.lg-res{color:var(--ok);background:var(--ok-soft)}
.lg-ana{color:var(--gris);background:var(--gris-s)}
.lg-exp{color:var(--accent);background:var(--accent-soft)}
#btn-analisis{margin-left:auto;border:1px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:999px;padding:6px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
#btn-analisis:hover{background:var(--accent-soft)}
dl.glos{margin:10px 0 0;display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:10px 22px}
dl.glos dt{font-weight:700}
dl.glos dd{margin:0;color:var(--muted)}
nav .toc-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);background:var(--gris-s);border-radius:999px;padding:0 6px;margin-left:4px}
nav a.k-analisis{font-style:italic}
#toggle{display:none}
@media (max-width:960px){
 dl.glos{grid-template-columns:1fr;gap:2px 0} dl.glos dd{margin-bottom:10px}
 .layout{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;inset:0 25% 0 0;transform:translateX(-100%);transition:transform .2s;z-index:30;box-shadow:0 0 40px rgba(0,0,0,.25)}
 aside.show{transform:none}
 #toggle{display:block;position:fixed;right:16px;bottom:16px;z-index:40;border:0;border-radius:999px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
 main{padding:24px 16px 90px}
 article.part{padding:22px 18px}
}
@media print{
 aside,#progress,#toggle,.pills,a.back,#tip,#btn-analisis{display:none!important}
 .term::after,.blk-hint{display:none}
 .layout{display:block} main{padding:0;max-width:none}
 body{background:#fff;font-size:12.5px}
 article.part{border:0;padding:0;break-before:page}
 .card,table,pre{break-inside:avoid}
}

.home{max-width:1040px;margin:0 auto;padding:48px 24px 80px}
.home h1{font-size:34px;margin:6px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:28px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.tile-backlog{border-left:5px solid var(--accent)}
.tile-kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.tile-title{font-size:19px;font-weight:700;line-height:1.3}
.tile-meta{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn-doc{font-size:13.5px;font-weight:600;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:6px 14px}
.btn-doc:hover{background:var(--accent);color:#fff}
.empty{color:var(--muted)}
</style></head><body><div class="home">
